# Render.com blueprint untuk backend Flask (openpyxl).
# Render -> New -> Blueprint -> pilih repo ini. rootDir = backend.
services:
  - type: web
    name: sl-otif-api
    runtime: python
    plan: free
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app --bind 0.0.0.0:$PORT --timeout 120 --workers 2
    healthCheckPath: /api/health
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.7"
